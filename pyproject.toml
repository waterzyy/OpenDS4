[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "opends4"
version = "1.1.0"
description = "DualShock 4 to Xbox 360 (XInput) controller mapper for Windows"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "OpenDS4 Contributors" }]
keywords = [
    "dualshock",
    "dualshock4",
    "ds4",
    "xinput",
    "vigembus",
    "gamepad",
    "controller",
    "windows",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: System :: Hardware",
]
dependencies = [
    "hidapi>=0.14.0",
    "vgamepad>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff==0.17.6",
]

[project.scripts]
opends4 = "app:main"

[project.urls]
Homepage = "https://github.com/waterzyy/OpenDS4"
Repository = "https://github.com/waterzyy/OpenDS4"
Issues = "https://github.com/waterzyy/OpenDS4/issues"
Changelog = "https://github.com/waterzyy/OpenDS4/blob/main/CHANGELOG.md"

[tool.setuptools]
py-modules = [
    "app",
    "ds4_engine",
    "ds4_profile",
    "ds4_protocol",
    "ds4_touchpad",
    "ds4_tray",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["profiles"]

[tool.ruff.lint]
# Core correctness checks. Style-only rules are not enforced.
select = ["E4", "E7", "E9", "F", "W"]
ignore = [
    "E402",  # app.py bootstraps the local .venv before importing project modules
]
